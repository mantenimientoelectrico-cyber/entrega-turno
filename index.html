<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Entrega de Turno</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 24px;
        }
        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            background-color: #fff;
        }
        legend {
            font-weight: bold;
            color: var(--accent-color);
            padding: 0 8px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .equipment-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .equipment-name {
            flex: 1 1 180px;
            font-weight: 600;
        }
        .status-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-options label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 0;
            cursor: pointer;
        }
        .obs-input {
            width: 100%;
            margin-top: 6px;
        }
        button.submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.submit-btn:hover {
            background-color: #1d4ed8;
        }
        textarea#resultado {
            font-family: monospace;
            background: #f1f5f9;
            height: 250px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-copy { background-color: #10b981; color: white; }
        .btn-email { background-color: #8b5cf6; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Entrega de Turno</h2>
    <form id="turnoForm">
        
        <!-- Datos Generales -->
        <fieldset>
            <legend>Información General</legend>
            
            <label>Emisor del Turno:</label>
            <select id="selectEmisor" onchange="actualizarCargo('Emisor')" required>
                <option value="">-- Seleccione su nombre --</option>
            </select>
            <input type="hidden" id="nombreEmisor">
            <input type="hidden" id="cargoEmisor">
            <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Cargo asignado: <strong id="txtCargoEmisor">---</strong></p>
            
            <label style="margin-top: 15px;">Receptor del Turno:</label>
            <select id="selectReceptor" onchange="actualizarCargo('Receptor')" required>
                <option value="">-- Seleccione quien recibe --</option>
            </select>
            <input type="hidden" id="nombreReceptor">
            <input type="hidden" id="cargoReceptor">
            <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Cargo asignado: <strong id="txtCargoReceptor">---</strong></p>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div style="flex: 1;">
                    <label>Turno:</label>
                    <input type="text" id="turnoHorario" required placeholder="Ej. 06:00 – 14:00">
                </div>
                <div style="flex: 1;">
                    <label>Fecha:</label>
                    <input type="date" id="fechaTurno" required>
                </div>
            </div>
        </fieldset>

        <!-- Estado de Equipos -->
        <fieldset>
            <legend>Estado de los Equipos</legend>
            <div id="listaEquipos"></div>
        </fieldset>

        <!-- Operación y Actividades -->
        <fieldset>
            <legend>Operación y Novedades</legend>
            
            <label>9. Operación actual:</label>
            <textarea id="operacionActual" rows="2" placeholder="Descripción breve de la operación actual..."></textarea>
            
            <label>10. Actividades relevantes / Novedades / Permisos:</label>
            <textarea id="actividadesRelevantes" rows="3" placeholder="1. Ej: Revisión de sensores... 2. ..."></textarea>
            
            <label>11. Áreas intervenidas ordenadas y aseadas:</label>
            <select id="areasAseadas">
                <option value="SI">SI</option>
                <option value="NO">NO</option>
            </select>
        </fieldset>

        <!-- Equipos Entregados -->
        <fieldset>
            <legend>Dotación y Equipos Entregados</legend>
            <label>Celular (Estado):</label>
            <input type="text" id="celularEstado" value="Operativo / Buen estado">
            
            <label>Radio (Estado):</label>
            <input type="text" id="radioEstado" value="Operativo / Buen estado">
        </fieldset>

        <button type="button" class="submit-btn" onclick="generarReporte()">Generar Reporte Formal</button>
    </form>

    <!-- Resultado -->
    <fieldset style="margin-top: 20px; background: #fff;">
        <legend>Reporte Generado</legend>
        <textarea id="resultado" readonly placeholder="El reporte estructurado aparecerá aquí al presionar el botón..."></textarea>
        <div class="action-buttons">
            <button type="button" class="btn-copy" onclick="copiarReporte()">Copiar al Portapapeles</button>
            <button type="button" class="btn-email" onclick="enviarCorreo()">Enviar por Correo</button>
        </div>
    </fieldset>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN DE PERSONAL (Modifica aquí)
    // ==========================================
    const personal = [
        { nombre: "Michael Martinez", cargo: "Supervisor de mantenimiento" },
        { nombre: "Roger Martinez", cargo: "Supervisor de de mantenimiento" },
        { nombre: "Juan M Polo", cargo: "Técnico de Mantenimiento" },
        { nombre: "Edwin Almanza", cargo: "Técnico de Mantenimiento" },
        { nombre: "Luis Pertuz", cargo: "Técnico de Mantenimiento" }
    ];

    // Cargar listas desplegables al iniciar
    window.onload = function() {
        const selectEmisor = document.getElementById('selectEmisor');
        const selectReceptor = document.getElementById('selectReceptor');

        personal.forEach((p, index) => {
            let opt1 = document.createElement('option');
            opt1.value = index;
            opt1.textContent = p.nombre;
            selectEmisor.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = index;
            opt2.textContent = p.nombre;
            selectReceptor.appendChild(opt2);
        });

        document.getElementById('fechaTurno').valueAsDate = new Date();
    };

    function actualizarCargo(tipo) {
        const select = document.getElementById(`select${tipo}`);
        const index = select.value;
        
        if(index === "") {
            document.getElementById(`nombre${tipo}`).value = "";
            document.getElementById(`cargo${tipo}`).value = "";
            document.getElementById(`txtCargo${tipo}`).textContent = "---";
            return;
        }

        const seleccionado = personal[index];
        document.getElementById(`nombre${tipo}`).value = seleccionado.nombre;
        document.getElementById(`cargo${tipo}`).value = seleccionado.cargo;
        document.getElementById(`txtCargo${tipo}`).textContent = seleccionado.cargo;
    }

    // Lista de equipos
    const equipos = [
        "Apilador", "Cargador de Barcos", "RE Sur", "RE Norte",
        "BC-04", "BC-05", "BC-06", "BC-07", "BANDA DE FINOS",
        "PV-1", "PV-2", "PV-3", "PV-4", "PV-5",
        "SF-1", "SF-2", "TRF",
        "Lavadero Ecológico", "LAVADERO PATIO 1", "LAVADERO PATIO 2", "LAVADERO PATIO 5"
    ];

    const contenedor = document.getElementById('listaEquipos');
    equipos.forEach((eq, index) => {
        const div = document.createElement('div');
        div.className = 'equipment-row';
        div.innerHTML = `
            <div class="equipment-name">${index + 1}. ${eq}</div>
            <div class="status-options">
                <label><input type="radio" name="eq_${index}" value="DO" checked onclick="toggleObs(${index}, false)"> DO</label>
                <label><input type="radio" name="eq_${index}" value="DNO" onclick="toggleObs(${index}, false)"> DNO</label>
                <label><input type="radio" name="eq_${index}" value="ND" onclick="toggleObs(${index}, true)"> ND</label>
            </div>
            <input type="text" id="obs_${index}" class="obs-input" placeholder="Especifique la novedad..." style="display:none;">
        `;
        contenedor.appendChild(div);
    });

    function toggleObs(index, mostrar) {
        const obsInput = document.getElementById(`obs_${index}`);
        obsInput.style.display = mostrar ? 'block' : 'none';
        if(!mostrar) obsInput.value = '';
    }

    function generarReporte() {
        const getVal = (id) => document.getElementById(id).value;
        
        if(!getVal('nombreEmisor') || !getVal('nombreReceptor')) {
            alert('Por favor selecciona tanto el emisor como el receptor del turno.');
            return;
        }

        let texto = `ENTREGA DE TURNO\n`;
        texto += `Yo, ${getVal('nombreEmisor')}, con cargo ${getVal('cargoEmisor')}, le entrego el turno a ${getVal('nombreReceptor')}, con cargo ${getVal('cargoReceptor')}.\n`;
        texto += `Turno: ${getVal('turnoHorario')}\n`;
        texto += `Fecha: ${getVal('fechaTurno')}\n\n`;
        
        texto += `Estado de los equipos:\n`;
        equipos.forEach((eq, index) => {
            const radios = document.getElementsByName(`eq_${index}`);
            let estadoSeleccionado = 'DO';
            for (const r of radios) {
                if (r.checked) estadoSeleccionado = r.value;
            }
            const obs = document.getElementById(`obs_${index}`).value;
            
            texto += `- ${eq}: Estado: ${estadoSeleccionado}`;
            if(obs) {
                texto += ` (${obs})`;
            }
            texto += `\n`;
        });

        texto += `\n8. Otros equipos o sistemas:\nNA\n\n`;
        texto += `9. Operación:\n${getVal('operacionActual') || 'Sin novedades en la operación.'}\n\n`;
        texto += `10. Actividades relevantes:\n${getVal('actividadesRelevantes') || 'Ninguna registrada.'}\n\n`;
        texto += `11. Áreas intervenidas: Se entregan ordenadas y aseadas (si/no): ${getVal('areasAseadas')}\n\n`;
        texto += `12. Equipos entregados:\n`;
        texto += `- Celular, Estado: ${getVal('celularEstado')}\n`;
        texto += `- Radio, Estado: ${getVal('radioEstado')}`;

        document.getElementById('resultado').value = texto;
    }

    function copiarReporte() {
        const resultado = document.getElementById('resultado');
        if(!resultado.value) {
            alert('Primero debes generar el reporte.');
            return;
        }
        resultado.select();
        navigator.clipboard.writeText(resultado.value);
        alert('¡Reporte copiado al portapapeles!');
    }

    function enviarCorreo() {
        const resultado = document.getElementById('resultado').value;
        if(!resultado) {
            alert('Primero debes generar el reporte.');
            return;
        }
        const asunto = encodeURIComponent(`Entrega de Turno - ${document.getElementById('fechaTurno').value}`);
        const cuerpo = encodeURIComponent(resultado);
        window.location.href = `mailto:?subject=${asunto}&body=${cuerpo}`;
    }
</script>

</body>
</html>
